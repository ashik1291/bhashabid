id: CRD-DFT-007
title: "Rule for Absence Substitution & Honorific Concordance in Official Dispatches"
domain: Constitutional Law & Writs
profile: bd_standard
register: formal
rule_summary: 'When drafting official appointments or judicial dispatches involving substitution during absence, avoid redundant repetitive pronouns (such as তার অবর্তমানে তার) and ensure honorific verbal agreement (তিনি ... করেন, NOT তিনি ... করে). Use formal administrative phrasing: কর্মকর্তার অনুপস্থিতিতে দায়িত্বভার পালন করেন।'
good_examples:
- তিনি চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি হিসেবে তাঁর অনুপস্থিতিতে যাবতীয় দায়িত্বভার পালন করেন।
- চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের অনুপস্থিতিতে ডেপুটি হিসেবে তিনি বিচারিক ও প্রশাসনিক সার্বিক দায়িত্ব পালন করেন।
- বিভাগীয় কর্মকর্তার অনুপস্থিতিতে দায়িত্বপ্রাপ্ত উপ-পরিচালক তাঁর যাবতীয় দাপ্তরিক কার্যভার পরিচালনা করবেন।
bad_examples:
- তিনি চীফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি হিসেবে তার অবর্তমানে তার দায়িত্বভার পালন করে
- তিনি বিচারকের অবর্তমানে তার দায়িত্ব পালন করে রায় প্রদান করেন।
- ডেপুটি ম্যাজিস্ট্রেট তার অনুপস্থিতিতে তার অফিসের কাজ করে।
common_llm_error: "LLMs repeat redundant pronouns ('তার অবর্তমানে তার') and mix 3rd-person honorific pronoun 'তিনি' with ordinary pronoun 'তার' and non-honorific verb 'করে'."
sources:

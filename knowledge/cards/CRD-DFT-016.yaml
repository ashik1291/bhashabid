id: CRD-DFT-016
title: 'Candidate Rule for Syntactic Typology Acronym: SVO / SOV'
domain: Academic Research & Methodology
profile: bd_standard
register: formal
rule_summary: In linguistic and syntactic analyses, translate typology acronyms like
  SVO and SOV into formal Bengali grammatical terms ('কর্তা-ক্রিয়া-কর্ম' and 'কর্তা-কর্ম-ক্রিয়া'
  respectively), retaining Latin acronyms in parentheses. This ensures precise syntactic
  discourse without relying on raw foreign abbreviations.
good_examples:
- পদক্রমের কাঠামোগত বিচারে বাংলা মূলত কর্তা-কর্ম-ক্রিয়া (SOV) বিন্যাসের ভাষা, যেখানে
  ইংরেজির সাধারণ বাক্যরীতি কর্তা-ক্রিয়া-কর্ম (SVO)।
- বাংলা বাক্যতত্ত্বের স্বাভাবিক নিয়ম অনুযায়ী সচরাচর কর্মপদের পরেই সমাপিকা ক্রিয়াপদ
  বসে, যা ইংরেজি পদক্রম থেকে সম্পূর্ণ স্বতন্ত্র।
- তুলনামূলক ভাষাতাত্ত্বিক বিশ্লেষণে বাক্যের পদবিন্যাসকে 'কর্তা-ক্রিয়া-কর্ম' (SVO)
  কাঠামো থেকে প্রমিত বাংলা 'কর্তা-কর্ম-ক্রিয়া' (SOV) রীতিতে রূপান্তরের ব্যাকরণিক নিয়ম
  ব্যাখ্যা করা হয়েছে।
bad_examples:
- ইংরেজি একটি উল্লেখযোগ্য SVO ভাষা কিন্তু বাংলা SOV ভাষা।
- যেমন- "অহন(কর্তা) ভালোবাসে(ক্রিয়া) তাকে(কর্ম)" হলো একটি SVO পদক্রম।
- সাবজেক্ট-ভার্ব-অবজেক্ট বিন্যাসে বাংলা বাক্য সাজালে তা কৃত্রিম শোনায়।
common_llm_error: LLMs leave syntactic abbreviations (SVO, SOV) untranslated or phonetically
  transliterate English terms ('সাবজেক্ট-ভার্ব-অবজেক্ট') instead of using standard
  Bengali grammatical categories ('কর্তা-কর্ম-ক্রিয়া').
sources:

id: CRD-DFT-005
title: 'Candidate Rule for Pattern: বড় বিপদের সংকেত'
domain: Disaster Early Warning
profile: bd_standard
register: formal
rule_summary: Automatically flagged pattern 'বড় বিপদের সংকেত' requires naturalization
  to active causal phrasing (e.g. 'স্বাভাবিক বাংলা প্রকাশভঙ্গি 'মহাবিপদ সংকেত' ব্যবহার
  করুন।').
good_examples:
- স্বাভাবিক বাংলা প্রকাশভঙ্গি 'মহাবিপদ সংকেত' ব্যবহার করুন।
bad_examples:
- বড় বিপদের সংকেত
- ঘূর্ণিঝড় কাছে আসায় সমুদ্রবন্দরগুলোকে ১০ নম্বর বড় বিপদের সংকেত উত্তোলন করতে বলা হয়েছে।
common_llm_error: LLMs emit literal calques or non-standard syntax for 'বড় বিপদের
  সংকেত'.
sources:

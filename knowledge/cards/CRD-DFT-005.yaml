id: CRD-DFT-005
title: "Rule for Meteorological Disaster Warning: 'মহাবিপদ সংকেত' (Great Danger Signal)"
domain: Agronomy & Disaster Management
profile: bd_standard
register: formal
rule_summary: 'In cyclone early warning bulletins and Disaster Management protocols, translate maritime warning signals 8, 9, and 10 strictly as মহাবিপদ সংকেত (Great Danger Signal), and signals 5, 6, 7 as বিপদ সংকেত (Danger Signal). Never invent literal descriptive phrases like বড় বিপদের সংকেত।'
good_examples:
- ঘূর্ণিঝড়টি প্রবল শক্তিতে উপকূলের দিকে অগ্রসর হওয়ায় মোংলা ও পায়রা সমুদ্রবন্দরকে ১০ নম্বর মহাবিপদ সংকেত প্রদর্শন করতে বলা হয়েছে।
- দুর্যোগ ব্যবস্থাপনা অধিদপ্তরের জরুরি নির্দেশনায় উপকূলীয় জেলাগুলোতে ৮ নম্বর মহাবিপদ সংকেত জারির পর আশ্রয়কেন্দ্রগুলো প্রস্তুত রাখা হয়েছে।
- উপকূলের নদী ও সমুদ্রবন্দরগুলোকে যথাসময়ে সতর্ক সংকেত থেকে মহাবিপদ সংকেতে উন্নীত করা হয়।
bad_examples:
- ঘূর্ণিঝড় কাছে আসায় সমুদ্রবন্দরগুলোকে ১০ নম্বর বড় বিপদের সংকেত উত্তোলন করতে বলা হয়েছে।
- আবহাওয়া অফিস উপকূলীয় অঞ্চলসমূহে আট নম্বর বিশাল বিপদের সংকেত দেখাতে বলেছে।
- ঝড় বেশি শক্তিশালী হওয়ায় চরম বিপদের সংকেত ঘোষণা করা হলো।
common_llm_error: "LLMs translate the maritime adjective 'Great' literally as 'বড়' or 'বিশাল', creating non-standard warning categories ('বড় বিপদের সংকেত') that violate the Ministry of Disaster Management's Standing Orders on Disaster (SOD)."

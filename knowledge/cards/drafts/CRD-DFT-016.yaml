id: CRD-DFT-016
title: 'Candidate Rule for Syntactic Typology Acronym: SVO / SOV'
domain: Academic Research & Methodology
profile: bd_standard
register: formal
rule_summary: In linguistic and academic syntactic analysis, translate sentence-order typology acronyms such as SVO and SOV using standard Bengali grammatical categories ('কর্তা-ক্রিয়া-কর্ম' for SVO and 'কর্তা-কর্ম-ক্রিয়া' for SOV), retaining the Latin acronym in parentheses for scholarly reference.
good_examples:
- বাংলা ভাষার স্বাভাবিক পদক্রম হলো কর্তা-কর্ম-ক্রিয়া (SOV), পক্ষান্তরে ইংরেজি প্রধানত কর্তা-ক্রিয়া-কর্ম (SVO) পদক্রমের ভাষা।
- বাক্যতাত্ত্বিক তুলনামূলক গবেষণায় প্রমিত বাংলা পদক্রমের স্বাতন্ত্র্য বিশ্লেষণ করা হয়েছে।
bad_examples:
- ইংরেজি একটি উল্লেখযোগ্য SVO ভাষা
- যেমন- "অহন(কর্তা) ভালোবাসে(ক্রিয়া) তাকে(কর্ম)" হলো একটি SVO পদক্রম
common_llm_error: LLMs leave linguistic typology abbreviations untranslated without standard Bengali grammatical equivalents.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Bengali Grammar & Philology'

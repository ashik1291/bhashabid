id: CRD-DFT-014
title: 'Candidate Rule for Administrative Term: Continuation Form'
domain: Education & NCTB Pedagogy
profile: bd_standard
register: formal
rule_summary: When referring to administrative verification forms such as 'continuation form' in academic contexts, use standard Bengali terminology such as 'অধ্যয়ন ধারাবাহিকতা ফরম' or 'ধারাবাহিকতা প্রত্যয়ন ফরম', optionally retaining the English term in parentheses.
good_examples:
- শিক্ষার্থী থাকার প্রমাণ হিসেবে প্রতি তিন মাস অন্তর প্রতিষ্ঠানপ্রধানের প্রত্যয়নসহ 'অধ্যয়ন ধারাবাহিকতা ফরম' (continuation form) জমা দিতে হবে।
- বৃত্তিপ্রাপ্ত শিক্ষার্থীদের নিয়মিত উপস্থিতির প্রমাণ হিসেবে প্রতি ত্রৈমাসিকে ধারাবাহিকতা প্রত্যয়ন ফরম দাখিল করা বাধ্যতামূলক।
bad_examples:
- শিক্ষার্থী থাকার প্রমাণ হিসেবে ৩ মাস পর পর বিভাগীয় এবং শিক্ষানুস্থানের প্রধানের স্বাক্ষর থাকা 'continution form' জমা দিতে হয়
- স্টুডেন্ট কন্টিনিউয়েশন ফর্ম ফিলাপ করে অফিসে সাবমিট করতে হবে।
common_llm_error: LLMs emit raw English jargon or unstandardized transliterations instead of formal administrative Bengali terms.
sources:

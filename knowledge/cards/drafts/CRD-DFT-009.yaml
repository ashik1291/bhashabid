id: CRD-DFT-009
title: 'Candidate Rule for Technical Acronym: OAuth'
domain: ICT & Software Engineering
profile: bd_standard
register: formal
rule_summary: When referencing the authentication framework 'OAuth', use the standard Bengali phonetic transliteration 'ওঅথ' along with 'OAuth' in parentheses on first mention, preserving technical clarity without leaving raw English tokens or unresolved documentation paths.
good_examples:
- ওঅথ (OAuth) হলো ইন্টারনেট ব্যবহারকারীদের নিরাপদ প্রমাণীকরণের একটি উন্মুক্ত প্রমিত প্রটোকল।
- অ্যাপ্লিকেশনটিতে নিরাপদ প্রবেশাধিকার নিশ্চিত করতে ওঅথ ২.০ (OAuth 2.0) ফ্রেমওয়ার্ক ব্যবহার করা হয়েছে।
bad_examples:
- মিডিয়াউইকির ওঅথ সমর্থনের জন্য দেখুন mw:Help:OAuth ওঅথ হল প্রবেশ প্রতিনিধিদের জন্য...
- OAuth ব্যবহার করে ইউজারের ডাটা ফেচ করা হচ্ছে।
common_llm_error: LLMs emit raw unadapted English technical tokens or unformatted documentation paths instead of standard Bengali technical transliteration with parenthetical English.
sources:

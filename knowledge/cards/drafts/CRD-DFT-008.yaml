id: CRD-DFT-008
title: 'Candidate Rule for Pattern: alphabet'
domain: Academic Research & Methodology
profile: bd_standard
register: formal
rule_summary: When the English term "alphabet" appears in Bengali academic writing,
  evaluate whether a suitable Bengali equivalent, such as "বর্ণমালা", preserves the
  intended linguistic meaning. Prefer standard Bengali terminology when the context
  permits. Retain the English term in parentheses when necessary for technical precision,
  disambiguation, or reference to a specific linguistic concept.
good_examples:
- বর্ণমালা (alphabet)
- বাংলা বর্ণমালার গঠন ও বৈশিষ্ট্য
- বিভিন্ন ভাষার বর্ণমালার তুলনামূলক বিশ্লেষণ
bad_examples:
- Bengali alphabet-এর পরিবর্তে অপ্রয়োজনে English terminology ব্যবহার করা, যখন "বাংলা
  বর্ণমালা" অর্থগতভাবে যথাযথ।
- Abjad-কে সরাসরি alphabet হিসেবে শ্রেণিবদ্ধ করা, যখন আলোচনার উদ্দেশ্য দুই ধরনের লিখন
  পদ্ধতির পার্থক্য নির্ধারণ করা।
common_llm_error: Unnecessary English terminology, literal translation, inconsistent
  Bengali terminology, and incorrect classification of linguistically distinct writing
  systems.
validation_requirements:
- Verify terminology against authoritative Bengali linguistic references.
- Validate positive and negative examples with contextual evidence.
- Ensure the rule does not force translations that alter technical meaning.
- Record traceable source references and human review evidence.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Linguistics & Academic Research'
- Principle P2 Human Provenance Audit Gate
- Bangla Academy Linguistic Research Methodology Guidelines
- Linguistic Society of Bangladesh Peer-Reviewed Standards

id: CRD-DFT-007
title: 'Candidate Rule for Pattern: অনুপস্থিতিতে দায়িত্বভার পালন'
domain: Constitutional Law & Writs
profile: bd_standard
register: formal
rule_summary: 'Automatically flagged pattern ''তিনি চীফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি
  হিসেবে তার অবর্তমানে তার দায়িত্বভার পালন করে'' contains redundant pronoun repetition
  (''তার অবর্তমানে তার'') and an honorific concordance clash (''তিনি ... করে''). "তার অবর্তমানে"
  means "in his/her absence" (কর্মকর্তার অনুপস্থিতিতে). Revised standard phrasing:
  ''তিনি চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি হিসেবে তাঁর অনুপস্থিতিতে দায়িত্বভার পালন করেন''
  অথবা ''চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের অনুপস্থিতিতে ডেপুটি হিসেবে তিনি দায়িত্ব পালন করেন'''
good_examples:
- তিনি চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি হিসেবে তাঁর অনুপস্থিতিতে দায়িত্বভার পালন করেন।
- চিফ মেট্রোপলিটন ম্যাজিস্ট্রেটের অনুপস্থিতিতে ডেপুটি হিসেবে তিনি সার্বিক দায়িত্ব পালন করেন।
bad_examples:
- তিনি চীফ মেট্রোপলিটন ম্যাজিস্ট্রেটের ডেপুটি হিসেবে তার অবর্তমানে তার দায়িত্বভার পালন করে
common_llm_error: LLMs repeat redundant pronouns ('তার অবর্তমানে তার') and mix 3rd-person
  honorific pronoun 'তিনি' with ordinary pronoun 'তার' and non-honorific verb 'করে'.
sources:

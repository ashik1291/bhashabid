id: CRD-DFT-074
title: 'Candidate Rule for Pattern: BBC, World, Service, News, not, share, s'
domain: Judicial & High Court
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'BBC, World, Service,
  News, not, share, sell, info' requires standard Bengali terminology or phonetic
  transliteration with English in parentheses.

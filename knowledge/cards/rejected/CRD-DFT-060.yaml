id: CRD-DFT-060
title: 'Candidate Rule for Pattern: Pence, Pennies'
domain: MFS, Microfinance & Grassroots FinTech
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'Pence, Pennies' requires
  standard Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- Pence (পেন্স) হলো অর্থমূল্য বোঝাতে ব্যবহৃত সাধারণ বহুবচন, আর Pennies (পেনিস) বলতে
  এক-পেনি মূল্যের পৃথক পৃথক মুদ্রা বোঝায়
common_llm_error: LLMs emit unadapted English terminology 'Pence, Pennies' in Bengali
  contexts.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Currency & Financial Inclusion'

id: CRD-DFT-020
title: 'Candidate Rule for Pattern: তিনি পদ ছাড়েন বলে'
domain: Macroeconomics & Banking
profile: bd_standard
register: formal
rule_summary: 'Automatically flagged pattern ''তিনি পদ ছাড়েন বলে'' requires naturalization
  to active causal phrasing (e.g. ''বিকল্প ১ (সম্ভ্রমাত্মক ক্রিয়াপদ): ''তিনি পদ ছাড়েন
  বলেন'' অথবা বিকল্প ২ (সাধারণ সর্বনাম): ''সে পদ ছাড়েন বলে'''').'
good_examples:
- 'বিকল্প ১ (সম্ভ্রমাত্মক ক্রিয়াপদ): ''তিনি পদ ছাড়েন বলেন'' অথবা বিকল্প ২ (সাধারণ
  সর্বনাম): ''সে পদ ছাড়েন বলে'''
bad_examples:
- এর জের ধরে এনভিডিয়ার পরিচালনা পর্ষদের সিদ্ধান্তে তিনি পদ ছাড়েন বলে জানা গেছে
common_llm_error: LLMs emit literal calques or non-standard syntax for 'তিনি পদ ছাড়েন
  বলে'.

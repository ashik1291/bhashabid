id: CRD-DFT-018
title: 'Candidate Rule for Pattern: তিনি চেয়ার থেকে উঠে দাঁড়িয়ে বললেন যে বিদ'
domain: Creative Fiction & Dialogue
profile: bd_standard
register: formal
rule_summary: 'Automatically flagged pattern ''তিনি চেয়ার থেকে উঠে দাঁড়িয়ে বললেন যে
  বিদায় নেওয়ার সময় হয়েছে'' requires naturalization to active causal phrasing (e.g.
  ''বিকল্প ১ (সম্ভ্রমাত্মক ক্রিয়াপদ): ''তিনি চেয়ার থেকে উঠে দাঁড়িয়ে বললেন যে বিদায়
  নেওয়ার সময় হয়েছেন'' অথবা বিকল্প ২ (সাধারণ সর্বনাম): ''সে চেয়ার থেকে উঠে দাঁড়িয়ে
  বললেন যে বিদায় নেওয়ার সময় হয়েছে'''').'

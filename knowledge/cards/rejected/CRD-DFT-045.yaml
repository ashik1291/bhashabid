id: CRD-DFT-045
title: 'Candidate Rule for Pattern: onion'
domain: Citizen Digital Services & Smart Governance
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'onion' requires standard
  Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- .অনিয়ন. .onion হল একটি বিশেষ-ব্যবহারের টপ-লেভেল ডোমেইন যা একটি বেনামী অনিয়ন পরিষেবার
  জন্য ব্যবহৃত হয়, যা পূর্বে "লুকানো পরিষেবা" নামে পরিচিত ছিল, যা টর নেটওয়ার্কের মাধ্যমে
  পৌঁছানো যেত
common_llm_error: LLMs emit unadapted English terminology 'onion' in Bengali contexts.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Digital Systems & Public Portals'
- Principle P2 Human Provenance Audit Gate
- Aspire to Innovate (a2i) Citizen Service Standards (স্মার্ট নাগরিক সেবা রূপরেখা)
- Bangladesh National Portal (bangladesh.gov.bd) Terminology Guide
- Election Commission Bangladesh National ID Registration Rules

id: CRD-DFT-034
title: 'Candidate Rule for Pattern: ASP, NET, SQL'
domain: Consumer E-Commerce & Retail Logistics
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'ASP, NET, SQL' requires
  standard Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- 'নপকমার্স. নপকমার্স (ইংরেজি: nopCommerce) এখনকার সময়ের অন্যতম জনপ্রিয় মুক্ত সোর্স
  ই-কর্মাস প্লাটফর্ম; যাতে ASP.NET MVC 5.0 এবং MS SQL ২০০৮ (অথবা এর পরের ভার্সন) ব্যাকএন্ড
  ডেটাবেজ এর জন্য ব্যবহার করা হয়েছে'
common_llm_error: LLMs emit unadapted English terminology 'ASP, NET, SQL' in Bengali
  contexts.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia E-Commerce & Retail'

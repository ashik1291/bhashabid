id: CRD-DFT-022
title: 'Candidate Rule for Pattern: তিনি সেই বিয়ে বাতিল করে'
domain: Macroeconomics & Banking
profile: bd_standard
register: formal
rule_summary: 'Automatically flagged pattern ''তিনি সেই বিয়ে বাতিল করে'' requires
  naturalization to active causal phrasing (e.g. ''বিকল্প ১ (সম্ভ্রমাত্মক ক্রিয়াপদ):
  ''তিনি সেই বিয়ে বাতিল করেন'' অথবা বিকল্প ২ (সাধারণ সর্বনাম): ''সে সেই বিয়ে বাতিল
  করে'''').'
good_examples:
- 'বিকল্প ১ (সম্ভ্রমাত্মক ক্রিয়াপদ): ''তিনি সেই বিয়ে বাতিল করেন'' অথবা বিকল্প ২ (সাধারণ
  সর্বনাম): ''সে সেই বিয়ে বাতিল করে'''
bad_examples:
- খানসা নবীজির কাছে গিয়ে অভিযোগ করলে তিনি সেই বিয়ে বাতিল করে দেন
common_llm_error: LLMs emit literal calques or non-standard syntax for 'তিনি সেই বিয়ে
  বাতিল করে'.

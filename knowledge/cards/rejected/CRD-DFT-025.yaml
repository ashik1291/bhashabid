id: CRD-DFT-025
title: 'Candidate Rule for Pattern: Ctrl'
domain: Macroeconomics & Banking
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'Ctrl' requires standard
  Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- 'Ctrl + A: সব তথ্য বা ফন্ট একসঙ্গে নির্বাচন করতে'
- 'Ctrl + X: কোনো ফাইল বা লেখা কাট করে সরিয়ে নিতে'
- 'Ctrl + Y: বাতিল করা কাজ পুনরায় ফিরিয়ে আনতে'
common_llm_error: LLMs emit unadapted English terminology 'Ctrl' in Bengali contexts.
sources:

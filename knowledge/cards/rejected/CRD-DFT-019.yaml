rule_summary: Automatically flagged pattern 'nbsp' requires naturalization to active
  causal phrasing (e.g. 'প্রমিত বাংলা অনুবাদ বা বন্ধনীসহ ব্যবহার করুন।').
good_examples:
- প্রমিত বাংলা অনুবাদ বা বন্ধনীসহ ব্যবহার করুন।
bad_examples:
- '&nbsp;দুই দশক পর অ্যান্ডি স্যাকস চরিত্রে ফিরেছেন অ্যান'
- নদীতে হারিয়েছে তাঁদের ঘর অভিযোজনে কত অর্থায়ন &nbsp; বাংলাদেশের তৃতীয় জাতীয়ভাবে নির্ধারিত
  অবদান বা এনডিসি ৩.০ অনুযায়ী, অভিযোজনের অগ্রাধিকার বাস্তবায়নে বছরে ৮ দশমিক ৫ বিলিয়ন
  ডলার প্রয়োজন
- '’ (সহিহ বুখারি, হাদিস: ৫২৩৩)&nbsp; এর শিক্ষা হলো, কোনো দুজনের মনে ভালোবাসা তৈরি
  হলে তাদের জন্য সবচেয়ে সুন্দর ও নিরাপদ পরিণতি বিয়ে'
- ’&nbsp; সাহাবিরা অবাক হয়ে জিজ্ঞেস করলেন, ‘আল্লাহর রাসুল, আমাদের কেউ নিজের চাহিদা
  পূরণ করবে, আর তাতেও কি সওয়াব হবে?’ নবীজি উত্তর দিলেন, ‘তোমরা বলো তো, যদি সে হারাম
  পথে তা পূরণ করত, তবে কি তার পাপ হতো না? ঠিক তেমনি সে যখন হালাল পথে তা পূরণ করে,
  তখন তার জন্য সওয়াব লেখা হয়

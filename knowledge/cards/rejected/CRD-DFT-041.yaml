id: CRD-DFT-041
title: 'Candidate Rule for Pattern: Peterme, com'
domain: Mass Media & Digital Journalism
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'Peterme, com' requires
  standard Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- সংক্ষিপ্ত রূপ, "ব্লগ" শব্দটি পিটার মেরহোলজ দ্বারা উদ্ভাবিত হয়েছিল, যিনি ১৯৯৯ সালের
  এপ্রিল বা মে মাসে তাঁর ব্লগ Peterme.com-এর সাইডবারে ওয়েব্লগ শব্দটি মজা করে ভেঙে
  ''ওই ব্লগ'' লিখেছলেন
common_llm_error: LLMs emit unadapted English terminology 'Peterme, com' in Bengali
  contexts.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Journalism & Media Studies'
- Principle P2 Human Provenance Audit Gate
- Bangladesh Press Council Code of Ethics & Stylebook
- Press Institute of Bangladesh (PIB) Media Reporting Standards

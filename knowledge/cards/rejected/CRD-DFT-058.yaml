id: CRD-DFT-058
title: 'Candidate Rule for Pattern: Ombre, des, jours, Les, Les, Vivants, le'
domain: Education & Pedagogy
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'Ombre, des, jours,
  Les, Les, Vivants, les, Morts' requires standard Bengali terminology or phonetic
  transliteration with English in parentheses.
good_examples: []
bad_examples:
- ’ ১৯০২ সালে প্রকাশিত হয় L’Ombre des jours, ১৯০৭ সালে Les Éblouissements এবং ১৯১৩
  সালে Les Vivants et les Morts কাব্যগ্রন্থ
common_llm_error: LLMs emit unadapted English terminology 'Ombre, des, jours, Les,
  Les, Vivants, les, Morts' in Bengali contexts.
sources:
- 'Corpus Harvest Provenance: Prothom Alo (Education & Pedagogy)'

id: CRD-DFT-051
title: 'Candidate Rule for Pattern: UNESCO, UNESCO, Media, and, Information,'
domain: Education & Pedagogy
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'UNESCO, UNESCO, Media,
  and, Information, Literacy, Framework, and, Recent, Initiatives' requires standard
  Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- 'UNESCO, UNESCO Media and Information Literacy Framework and Recent Initiatives,
  https://www.unesco.gov.ph/wp-content/uploads/2020/03/UNESCO-Media-and-Information-Literacy-Framework-and-Recent-Initiatives.pdf
  , প্রবেশ: ২০ মার্চ ২০২৪'
common_llm_error: LLMs emit unadapted English terminology 'UNESCO, UNESCO, Media,
  and, Information, Literacy, Framework, and, Recent, Initiatives' in Bengali contexts.

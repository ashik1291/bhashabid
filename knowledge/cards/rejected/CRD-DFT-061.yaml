id: CRD-DFT-061
title: 'Candidate Rule for Pattern: Ledger, nano'
domain: MFS, Microfinance & Grassroots FinTech
profile: bd_standard
register: formal
rule_summary: Foreign terminology or unquoted Latin-script word 'Ledger, nano' requires
  standard Bengali terminology or phonetic transliteration with English in parentheses.
good_examples: []
bad_examples:
- 'এখানে দুটি ওয়ালেট এর কথা বলা হলো : i) Ledger nano s: এটি একটি বিটকয়েন সিকিউরিটি
  কোম্পানি যা প্রচুর সিকিওর বিটকয়েন স্টোরেজ ডিভাইস দেয়'
common_llm_error: LLMs emit unadapted English terminology 'Ledger, nano' in Bengali
  contexts.
sources:
- 'Corpus Harvest Provenance: Bangla Wikipedia Currency & Financial Inclusion'
- Principle P2 Human Provenance Audit Gate
- Bangladesh Bank Payment Systems Department (PSD) MFS Guidelines
- Microcredit Regulatory Authority (MRA) Rules & Standards
- Anti-Money Laundering & Financial Fraud Prevention Protocols

id: CRD-DFT-004
title: 'Candidate Rule for Pattern: জিজ্ঞেস করে একটি রুল'
domain: Judicial & High Court
profile: bd_standard
register: formal
rule_summary: Automatically flagged pattern 'জিজ্ঞেস করে একটি রুল' requires naturalization
  to active causal phrasing (e.g. 'স্বাভাবিক বাংলা প্রকাশভঙ্গি 'কেন ... হবে না, তা
  জানতে চেয়ে রুল জারি করেছেন' ব্যবহার করুন।').
good_examples:
- স্বাভাবিক বাংলা প্রকাশভঙ্গি 'কেন ... হবে না, তা জানতে চেয়ে রুল জারি করেছেন' ব্যবহার
  করুন।
bad_examples:
- জিজ্ঞেস করে একটি রুল
- হাইকোর্ট সরকারকে জিজ্ঞেস করে একটি রুল জারি করেছে কেন আটক বেআইনি হবে না।
common_llm_error: LLMs emit literal calques or non-standard syntax for 'জিজ্ঞেস করে
  একটি রুল'.

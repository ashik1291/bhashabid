id: CRD-DFT-009
title: 'Candidate Rule for Technical Acronym: OAuth'
domain: ICT & Software Engineering
profile: bd_standard
register: formal
rule_summary: When referencing the open authorization protocol OAuth, use the standard
  Bengali phonetic transliteration ওঅথ followed by OAuth in parentheses on first mention.
  Pair with formal computing terminology to eliminate code-mixing while preserving
  engineering precision.
good_examples:
- ওঅথ (OAuth) প্রটোকল ব্যবহারের মাধ্যমে ব্যবহারকারীর মূল পাসওয়ার্ড প্রকাশ না করেই
  তৃতীয় পক্ষের অ্যাপ্লিকেশনকে নির্দিষ্ট তথ্যে নিরাপদ প্রবেশাধিকার প্রদান করা যায়।
- ব্যবহারকারীর তথ্যের সর্বোচ্চ গোপনীয়তা বজায় রাখতে এবং নিরাপদ উপাত্ত বিনিময় নিশ্চিত
  করতে সিস্টেমে ওঅথ ২.০ (OAuth 2.0) ফ্রেমওয়ার্ক বাস্তবায়ন করা হয়েছে।
- ব্যবহারকারীকে বারবার পরিচয় নিশ্চিতকরণের ঝামেলা ছাড়াই অ্যাপ্লিকেশনটি ওঅথ প্রটোকলের
  সহায়তায় নিরাপদ প্রবেশাধিকার সংকেত (Access Token) সংগ্রহ করে।
bad_examples:
- OAuth দিয়ে ইউজারের ডাটা ফেচ করতে অথরাইজেশন টোকেন জেনারেট করুন।
- মিডিয়াউইকির ওঅথ সমর্থনের জন্য দেখুন mw:Help:OAuth ওঅথ হল প্রবেশ প্রতিনিধিদের জন্য
  একটি বিশেষ মুক্ত আদর্শ...
- ওপেন অথরাইজেশন হলো এমন এক মুক্ত অনুমোদক যা অন্যের ওয়েবসাইটে বিনা পাসওয়ার্ডে আপনাকে
  ঢুকিয়ে দেবে।
common_llm_error: LLMs alternate between heavy English code-mixing and unnatural literal
  translations instead of established Bengali computing terminology.

id: CRD-DFT-006
title: 'Candidate Rule for Pattern: ঝোপের চারপাশে পেটাচ্ছেন'
domain: Creative Fiction & Dialogue
profile: bd_standard
register: formal
rule_summary: Automatically flagged pattern 'ঝোপের চারপাশে পেটাচ্ছেন' requires naturalization
  to active causal phrasing (e.g. 'স্বাভাবিক বাংলা প্রকাশভঙ্গি 'ঘুরিয়ে-পেঁচিয়ে কথা
  বলা / মূল প্রসঙ্গ এড়িয়ে যাওয়া' ব্যবহার করুন।').
good_examples:
- স্বাভাবিক বাংলা প্রকাশভঙ্গি 'ঘুরিয়ে-পেঁচিয়ে কথা বলা / মূল প্রসঙ্গ এড়িয়ে যাওয়া' ব্যবহার
  করুন।
bad_examples:
- ঝোপের চারপাশে পেটাচ্ছেন
- আপনি কেন সবসময় ঝোপের চারপাশে পেটাচ্ছেন? এই কাজটি কোনো কেকের টুকরো নয়।
common_llm_error: LLMs emit literal calques or non-standard syntax for 'ঝোপের চারপাশে
  পেটাচ্ছেন'.

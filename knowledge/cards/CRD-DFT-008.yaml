id: CRD-DFT-008
title: "Rule for Academic Linguistics: Terminology for 'Alphabet' vs 'Writing Systems'"
domain: Academic Research & Methodology
profile: bd_standard
register: formal
rule_summary: 'When translating or referencing the term alphabet in academic and linguistic discourse, prefer standard Bengali বর্ণমালা where semantically appropriate. Retain the English term in parentheses on first mention for technical precision, and maintain strict terminological distinction between alphabetic, abjad, and abugida writing systems.'
good_examples:
- বাংলা বর্ণমালার গঠন ও ঐতিহাসিক বিবর্তন নিয়ে গবেষকগণ বিস্তারিত আলোকপাত করেছেন।
- বিভিন্ন ভাষার লিখন পদ্ধতি ও বর্ণমালার (alphabet) তুলনামূলক বিশ্লেষণে ধ্বনিতাত্ত্বিক বৈশিষ্ট্যসমূহ চিহ্নিত করা হয়েছে।
- স্বরবর্ণসমৃদ্ধ বাংলা বর্ণমালা (Abugida/Alphasyllabary) এবং আরবি আবজাদ (Abjad) লিখনরীতির কাঠামোগত পার্থক্য তাত্ত্বিকভাবে বিশ্লেষণ করা প্রয়োজন।
bad_examples:
- Bengali alphabet-এর ব্যাকরণিক গঠন ইংরেজি অ্যালফাবেটের চেয়ে অনেকটাই ভিন্ন।
- আরবি আবজাদকে কোনো তাত্ত্বিক পার্থক্য ছাড়াই সরাসরি অ্যালফাবেট বা সাধারণ বর্ণমালা হিসেবে অনুবাদ করা।
- বাংলা বর্ণমালার আলোচনায় অপ্রয়োজনে ইংরেজি alphabet টার্মিনোলজি বারবার ব্যবহার করা।
common_llm_error: 'LLMs indiscriminately use Latin transliterations (অ্যালফাবেট) instead of established Bengali linguistic terms (বর্ণমালা), and fail to distinguish between alphabets, abjads, and abugidas.'

name: Security & Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly automated security audit

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: SAST, Dependency SCA & Hygiene Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies & Security Scanners
      run: |
        python -m pip install --upgrade pip
        pip install bandit build twine defusedxml pyyaml requests

    - name: Run Bandit AST Security Scan (SARIF Report)
      run: |
        bandit -r bhashabid/ tools/ -ll -f sarif -o bandit-results.sarif || true
        bandit -r bhashabid/ tools/ -ll

    - name: Upload Bandit SARIF to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: bandit-results.sarif
        category: bandit-sast

    - name: Run Security Posture Unit Tests
      run: |
        python -m unittest eval/unit/test_security_posture.py

    - name: Run Complete Unit Test Suite (Principle P8)
      run: |
        python -m unittest discover -s eval/unit -p "test_*.py"

    - name: Verify Package Build Hygiene
      run: |
        python -m build
        twine check dist/*
